<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <!-- PWA & Browser Identity -->
    <title>Fleetora — Smart Transportation & Logistics</title>
    <meta name="application-name" content="Fleetora">
    <meta name="description" content="Fleetora — Enterprise Smart Transportation & On-Demand Freight Logistics Platform">
    <meta name="theme-color" content="#00366F">

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest">

    <!-- Modern & Legacy Favicons -->
    <link rel="icon" type="image/svg+xml" href="/brand/fleetora-gps-icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <!-- Apple iOS Identity -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Fleetora">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Windows Tile Identity -->
    <meta name="msapplication-TileColor" content="#00366F">
    <meta name="msapplication-TileImage" content="/fleetora-icon-192.png">

    <!-- Open Graph Branding -->
    <meta property="og:title" content="Fleetora — Smart Transportation & Logistics">
    <meta property="og:site_name" content="Fleetora">
    <meta property="og:description" content="Enterprise On-Demand Freight & Logistics Platform">
    <meta property="og:image" content="/fleetora-icon-512.png">
    <meta property="og:type" content="website">

    <!-- Twitter Branding -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Fleetora — Smart Transportation & Logistics">
    <meta name="twitter:image" content="/fleetora-icon-512.png">

    <!-- Open-Source Mapping Stack: MapLibre GL JS + OpenStreetMap (No Google Maps API Key Required) -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
